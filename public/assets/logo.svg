<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Vibrant Modern Indigo & Cyan Gradient -->
    <linearGradient id="talk-bubble-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="60%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Ambient Shadow Filter -->
    <filter id="talk-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#6366f1" flood-opacity="0.4"/>
    </filter>
  </defs>

  <g filter="url(#talk-shadow)">
    <!-- Perfectly Centered Balanced Talking Speech Bubble -->
    <path d="M32 8C18.745 8 8 18.297 8 31C8 37.684 11.026 43.702 15.932 47.935L13.12 55.438C12.784 56.335 13.665 57.216 14.562 56.88L22.955 53.733C25.795 54.887 28.826 55.534 32 55.534C45.255 55.534 56 45.237 56 32.534C56 19.831 45.255 8 32 8Z" 
          fill="url(#talk-bubble-grad)"/>

    <!-- Crisp Center Audio / Voice Waves (The Talking Pulse) -->
    <rect x="20" y="27" width="3.5" height="10" rx="1.75" fill="#ffffff" opacity="0.9"/>
    <rect x="27" y="21" width="3.5" height="22" rx="1.75" fill="#ffffff"/>
    <rect x="34" y="17" width="3.5" height="30" rx="1.75" fill="#ffffff"/>
    <rect x="41" y="23" width="3.5" height="18" rx="1.75" fill="#ffffff" opacity="0.9"/>
  </g>
</svg>