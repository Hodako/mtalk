<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="mtalk-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="mtalk-accent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#6366f1" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Outer Rounded Shield / Rounded Rectangle -->
  <rect x="24" y="24" width="464" height="464" rx="120" fill="#121216" stroke="#27272a" stroke-width="8"/>
  
  <!-- Subtle Background Glow -->
  <circle cx="256" cy="240" r="160" fill="url(#mtalk-grad)" opacity="0.15" filter="url(#glow)"/>

  <!-- MTalk Dynamic "M" with Speech Bubble Tail -->
  <g filter="url(#glow)">
    <!-- Main Left Stem -->
    <path d="M128 352V180C128 162.327 142.327 148 160 148C177.673 148 192 162.327 192 180V352" stroke="url(#mtalk-grad)" stroke-width="36" stroke-linecap="round"/>
    
    <!-- Central Flowing Waves (M Peaks) -->
    <path d="M192 200L240 272C247.5 283.5 264.5 283.5 272 272L320 200" stroke="url(#mtalk-grad)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Right Stem with Speech Bubble Curvature -->
    <path d="M320 352V180C320 162.327 334.327 148 352 148C369.673 148 384 162.327 384 180V310C384 338 360 360 332 360H290L244 394C236 400 224 394 224 384V360" stroke="url(#mtalk-grad)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Audio / Connection Pulsing Dots -->
    <circle cx="160" cy="180" r="12" fill="#38bdf8"/>
    <circle cx="256" cy="274" r="14" fill="#a855f7"/>
    <circle cx="352" cy="180" r="12" fill="#38bdf8"/>
  </g>
</svg>